<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 340"
     font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif">

<defs>

  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <linearGradient id="background"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">

    <stop offset="0%" stop-color="#010407"/>
    <stop offset="50%" stop-color="#030A12"/>
    <stop offset="100%" stop-color="#010305"/>

  </linearGradient>


  <!-- ================================================= -->
  <!-- ELECTRIC BLUE GLOW -->
  <!-- ================================================= -->

  <radialGradient id="electricGlow"
                  cx="50%" cy="50%"
                  r="65%">

    <stop offset="0%"
          stop-color="#00BFFF"
          stop-opacity=".25"/>

    <stop offset="35%"
          stop-color="#008CFF"
          stop-opacity=".13"/>

    <stop offset="70%"
          stop-color="#0055AA"
          stop-opacity=".05"/>

    <stop offset="100%"
          stop-color="#000000"
          stop-opacity="0"/>

  </radialGradient>


  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <linearGradient id="electricTitle"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%">

    <stop offset="0%"
          stop-color="#FFFFFF"/>

    <stop offset="30%"
          stop-color="#D9F6FF"/>

    <stop offset="55%"
          stop-color="#5DD8FF"/>

    <stop offset="78%"
          stop-color="#00B7FF"/>

    <stop offset="100%"
          stop-color="#0088FF"/>

  </linearGradient>


  <!-- ================================================= -->
  <!-- ELECTRIC LINE -->
  <!-- ================================================= -->

  <linearGradient id="electricLine"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%">

    <stop offset="0%"
          stop-color="#0066FF"/>

    <stop offset="50%"
          stop-color="#00E5FF"/>

    <stop offset="100%"
          stop-color="#0066FF"/>

  </linearGradient>


  <!-- ================================================= -->
  <!-- SCAN -->
  <!-- ================================================= -->

  <linearGradient id="scan"
                  x1="0%"
                  y1="0%"
                  x2="0%"
                  y2="100%">

    <stop offset="0%"
          stop-color="#00C8FF"
          stop-opacity="0"/>

    <stop offset="50%"
          stop-color="#00C8FF"
          stop-opacity=".12"/>

    <stop offset="100%"
          stop-color="#00C8FF"
          stop-opacity="0"/>

  </linearGradient>


  <!-- ================================================= -->
  <!-- GLOW FILTERS -->
  <!-- ================================================= -->

  <filter id="blueGlow"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">

    <feGaussianBlur stdDeviation="7"/>

  </filter>


  <filter id="smallGlow"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">

    <feGaussianBlur stdDeviation="2.5"/>

  </filter>


  <!-- ================================================= -->
  <!-- ANIMATIONS -->
  <!-- ================================================= -->

  <style>

    .electricPulse {
      animation:electricPulse 2.5s ease-in-out infinite;
    }

    @keyframes electricPulse {

      0%,100% {
        opacity:.35;
      }

      50% {
        opacity:1;
      }

    }


    .scanMove {
      animation:scanMove 4s linear infinite;
    }

    @keyframes scanMove {

      from {
        transform:translateY(-80px);
      }

      to {
        transform:translateY(420px);
      }

    }


    .dashMove {
      stroke-dasharray:14 10;
      animation:dashMove 1.3s linear infinite;
    }

    @keyframes dashMove {

      to {
        stroke-dashoffset:-48;
      }

    }


    .cursor {
      animation:cursorBlink 1s steps(1) infinite;
    }

    @keyframes cursorBlink {

      50% {
        opacity:0;
      }

    }


    .titleFlicker {
      animation:titleFlicker 5s infinite;
    }

    @keyframes titleFlicker {

      0%,94%,100% {
        opacity:1;
      }

      95% {
        opacity:.75;
      }

      96% {
        opacity:1;
      }

      97% {
        opacity:.85;
      }

    }

  </style>

</defs>


<!-- ================================================= -->
<!-- BASE -->
<!-- ================================================= -->

<rect width="1200"
      height="340"
      fill="url(#background)"/>


<!-- ================================================= -->
<!-- CENTRAL ELECTRIC FIELD -->
<!-- ================================================= -->

<rect x="100"
      y="0"
      width="1000"
      height="340"
      fill="url(#electricGlow)"
      class="electricPulse"/>


<!-- ================================================= -->
<!-- ENGINEERING GRID -->
<!-- ================================================= -->

<g stroke="#082033"
   stroke-width="1"
   opacity=".65">

  <path d="
    M0 50H1200
    M0 100H1200
    M0 150H1200
    M0 200H1200
    M0 250H1200
    M0 300H1200
  "/>

  <path d="
    M60 0V340
    M180 0V340
    M300 0V340
    M420 0V340
    M540 0V340
    M660 0V340
    M780 0V340
    M900 0V340
    M1020 0V340
    M1140 0V340
  "/>

</g>


<!-- ================================================= -->
<!-- ELECTRICAL CIRCUIT -->
<!-- ================================================= -->

<g fill="none"
   stroke="url(#electricLine)"
   stroke-width="2">

  <path d="
    M35 80
    H150
    L180 110
    H285
  "
  opacity=".7"/>

  <path d="
    M1165 80
    H1050
    L1020 110
    H915
  "
  opacity=".7"/>

  <path d="
    M35 260
    H135
    L175 220
    H270
  "
  opacity=".5"/>

  <path d="
    M1165 260
    H1065
    L1025 220
    H930
  "
  opacity=".5"/>

</g>


<!-- ================================================= -->
<!-- ELECTRICAL NODES -->
<!-- ================================================= -->

<g fill="#00D9FF">

  <circle cx="150"
          cy="80"
          r="4"
          class="electricPulse"/>

  <circle cx="285"
          cy="110"
          r="3"/>

  <circle cx="1050"
          cy="80"
          r="4"
          class="electricPulse"/>

  <circle cx="915"
          cy="110"
          r="3"/>

  <circle cx="135"
          cy="260"
          r="3"/>

  <circle cx="1065"
          cy="260"
          r="3"/>

</g>


<!-- ================================================= -->
<!-- CENTRAL CORE -->
<!-- ================================================= -->

<g transform="translate(600 142)">

  <circle r="52"
          fill="none"
          stroke="#006EFF"
          stroke-width="1"
          opacity=".35"/>

  <circle r="42"
          fill="none"
          stroke="#00C8FF"
          stroke-width="1.5"
          opacity=".6"
          class="dashMove"/>

  <circle r="31"
          fill="#02070D"
          stroke="#00D9FF"
          stroke-width="2"
          opacity=".95"/>

  <!-- lightning symbol -->

  <path d="
    M5 -20
    L-10 3
    H2
    L-5 21
    L13 -5
    H2
    Z
  "
  fill="#FFFFFF"
  filter="url(#smallGlow)"/>

</g>


<!-- ================================================= -->
<!-- TOP SYSTEM LABELS -->
<!-- ================================================= -->

<g font-family="'Segoe UI',Arial,sans-serif"
   font-size="11"
   font-weight="600"
   letter-spacing="3">

  <text x="38"
        y="32"
        fill="#4E8EAF">

    DREXON // SYSTEM

  </text>

  <text x="1162"
        y="32"
        text-anchor="end"
        fill="#4E8EAF">

    ELECTRIC CORE // ONLINE

  </text>

</g>


<!-- ================================================= -->
<!-- TITLE GLOW -->
<!-- ================================================= -->

<text x="600"
      y="205"
      text-anchor="middle"
      font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif"
      font-size="72"
      font-weight="900"
      letter-spacing="5"
      fill="#00BFFF"
      filter="url(#blueGlow)"
      opacity=".65">

  DREXON KELVIX

</text>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<text x="600"
      y="205"
      text-anchor="middle"
      font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif"
      font-size="72"
      font-weight="900"
      letter-spacing="5"
      fill="url(#electricTitle)"
      class="titleFlicker">

  DREXON KELVIX

</text>


<!-- ================================================= -->
<!-- UNDERLINE -->
<!-- ================================================= -->

<rect x="355"
      y="218"
      width="490"
      height="2"
      rx="1"
      fill="url(#electricLine)"/>


<rect x="475"
      y="218"
      width="250"
      height="2"
      fill="#FFFFFF"
      opacity=".8"/>


<!-- ================================================= -->
<!-- SUBTITLE -->
<!-- ================================================= -->

<text x="600"
      y="251"
      text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif"
      font-size="15"
      font-weight="600"
      letter-spacing="4"
      fill="#B8D7E8">

  COMPUTER ENGINEERING
  <tspan fill="#00BFFF"> // </tspan>
  CYBERSECURITY
  <tspan fill="#00BFFF"> // </tspan>
  SOFTWARE DEVELOPMENT

</text>


<!-- ================================================= -->
<!-- TERMINAL -->
<!-- ================================================= -->

<text x="600"
      y="282"
      text-anchor="middle"
      font-family="'Consolas','Courier New',monospace"
      font-size="14"
      letter-spacing="2"
      fill="#54768C">

  <tspan fill="#00BFFF">&gt;</tspan>
  drexon_core --initialize --secure
  <tspan fill="#00D9FF"
         class="cursor">█</tspan>

</text>


<!-- ================================================= -->
<!-- BOTTOM STATUS -->
<!-- ================================================= -->

<g font-family="'Consolas','Courier New',monospace"
   font-size="10"
   letter-spacing="2"
   fill="#3E6378">

  <text x="38" y="320">
    STATUS: OPERATIONAL
  </text>

  <text x="600"
        y="320"
        text-anchor="middle">

    CODE • NETWORK • SECURITY • ENGINEERING

  </text>

  <text x="1162"
        y="320"
        text-anchor="end">

    DREXON_CORE // 2026

  </text>

</g>


<!-- ================================================= -->
<!-- HUD CORNERS -->
<!-- ================================================= -->

<g fill="none"
   stroke-width="2">

  <path d="M22 58V22H105"
        stroke="#00BFFF"
        class="dashMove"/>

  <path d="M22 282V318H105"
        stroke="#00BFFF"
        class="dashMove"/>

  <path d="M1178 58V22H1095"
        stroke="#00BFFF"
        class="dashMove"/>

  <path d="M1178 282V318H1095"
        stroke="#00BFFF"
        class="dashMove"/>

</g>


<!-- ================================================= -->
<!-- MOVING SCAN -->
<!-- ================================================= -->

<rect x="0"
      y="-80"
      width="1200"
      height="80"
      fill="url(#scan)"
      class="scanMove"/>


<!-- ================================================= -->
<!-- ELECTRIC PARTICLES -->
<!-- ================================================= -->

<g fill="#00C8FF">

  <circle cx="240"
          cy="300"
          r="1.5">

    <animate attributeName="cy"
             values="300;70"
             dur="6s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="6s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="960"
          cy="300"
          r="1.5">

    <animate attributeName="cy"
             values="300;60"
             dur="7s"
             begin="1s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="7s"
             begin="1s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="400"
          cy="320"
          r="1">

    <animate attributeName="cy"
             values="320;90"
             dur="8s"
             begin="2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.7;0"
             dur="8s"
             begin="2s"
             repeatCount="indefinite"/>

  </circle>

</g>

</svg>
